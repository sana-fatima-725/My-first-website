<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Access — Ahsan Mobiles</title>
<!-- FAVICON -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0a14'/%3E%3Crect x='1' y='1' width='30' height='30' rx='7' fill='none' stroke='%237c3aed' stroke-width='1.5'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle' font-family='Arial'%3E🔐%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-root:#060610;--bg-card:#0f0f1e;--bg-input:#1a1a2e;
  --purple:#7c3aed;--purple-light:#a78bfa;--purple-dark:#4c1d95;
  --cyan:#00d4ff;--green:#10b981;--red:#ef4444;
  --text:#f0f0ff;--text-muted:rgba(255,255,255,0.35);
  --border:rgba(255,255,255,0.07);--border-purple:rgba(124,58,237,0.3);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg-root);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;}
.bg-orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:0.12;animation:floatOrb 8s ease-in-out infinite;pointer-events:none;}
.bg-orb-1{width:400px;height:400px;background:var(--purple);top:-100px;left:-100px;animation-delay:0s;}
.bg-orb-2{width:300px;height:300px;background:var(--cyan);bottom:-80px;right:-80px;animation-delay:-4s;}
.bg-orb-3{width:200px;height:200px;background:var(--purple-light);top:50%;right:10%;animation-delay:-2s;}
@keyframes floatOrb{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-30px) scale(1.05);}}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(124,58,237,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(124,58,237,0.04) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;}
.login-wrap{position:relative;z-index:10;width:100%;max-width:420px;animation:slideUp 0.6s cubic-bezier(0.16,1,0.3,1) both;}
@keyframes slideUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
.brand-bar{text-align:center;margin-bottom:24px;}
.brand-logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:800;font-size:17px;letter-spacing:-0.3px;}
.brand-logo em{color:var(--purple-light);font-style:normal;}
.admin-card{background:var(--bg-card);border:1px solid var(--border-purple);border-radius:24px;padding:40px 36px;box-shadow:0 40px 80px rgba(0,0,0,0.6),0 0 0 1px rgba(124,58,237,0.1) inset;position:relative;overflow:hidden;}
.admin-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--purple),var(--cyan),var(--purple),transparent);}
.card-header{text-align:center;margin-bottom:32px;}
.icon-wrap{width:60px;height:60px;background:linear-gradient(135deg,var(--purple),var(--purple-dark));border-radius:18px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 8px 24px rgba(124,58,237,0.4);}
.card-title{font-size:22px;font-weight:800;color:var(--text);letter-spacing:-0.5px;}
.card-sub{color:var(--text-muted);font-size:13px;margin-top:4px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:11px;font-weight:700;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:7px;}
.input-wrap{position:relative;}
.input-wrap .icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:15px;opacity:0.5;pointer-events:none;}
.field input{width:100%;padding:12px 14px 12px 40px;background:var(--bg-input);border:1.5px solid var(--border);border-radius:12px;font-size:14px;font-family:'Plus Jakarta Sans',sans-serif;color:var(--text);outline:none;transition:border-color 0.2s,box-shadow 0.2s;}
.field input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(124,58,237,0.15);}
.field input::placeholder{color:rgba(255,255,255,0.2);}
/* CAPTCHA */
.captcha-section{margin-bottom:20px;}
.captcha-label{display:block;font-size:11px;font-weight:700;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:9px;}
.captcha-box{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.captcha-display{flex:1;background:linear-gradient(135deg,#0d0d20,#1a1a35);border:1.5px solid var(--border-purple);border-radius:12px;padding:14px 20px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;min-height:54px;}
.captcha-display::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent,transparent 3px,rgba(124,58,237,0.03) 3px,rgba(124,58,237,0.03) 6px);}
.captcha-chars{display:flex;gap:5px;position:relative;z-index:1;}
.c-char{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;user-select:none;}
.c-char:nth-child(1){color:#a78bfa;transform:rotate(-8deg) translateY(2px);}
.c-char:nth-child(2){color:#00d4ff;transform:rotate(5deg) translateY(-3px);}
.c-char:nth-child(3){color:#f5c518;transform:rotate(-4deg) translateY(3px);}
.c-char:nth-child(4){color:#10b981;transform:rotate(7deg) translateY(-2px);}
.c-char:nth-child(5){color:#a78bfa;transform:rotate(-5deg) translateY(2px);}
.captcha-refresh{width:44px;height:44px;background:rgba(124,58,237,0.1);border:1px solid var(--border-purple);border-radius:11px;color:var(--purple-light);font-size:16px;cursor:pointer;transition:0.2s;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.captcha-refresh:hover{background:rgba(124,58,237,0.2);transform:rotate(15deg);}
.captcha-input{width:100%;padding:11px 14px;background:var(--bg-input);border:1.5px solid var(--border);border-radius:12px;font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;letter-spacing:6px;color:var(--text);outline:none;text-transform:uppercase;text-align:center;transition:border-color 0.2s,box-shadow 0.2s;}
.captcha-input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(124,58,237,0.15);}
.captcha-hint{color:var(--text-muted);font-size:11px;margin-top:6px;text-align:center;}
.captcha-msg{font-size:12px;font-weight:600;margin-top:6px;text-align:center;display:none;}
.captcha-msg.err{color:var(--red);display:block;}
.captcha-msg.ok{color:var(--green);display:block;}
.err-box{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);border-radius:11px;color:var(--red);font-size:13px;font-weight:600;text-align:center;padding:11px;margin-bottom:16px;display:none;}
.err-box.show{display:block;}
.btn-login{width:100%;background:linear-gradient(135deg,var(--purple),var(--purple-dark));color:#fff;border:none;padding:15px;border-radius:13px;font-size:15px;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;transition:all 0.2s;box-shadow:0 8px 24px rgba(124,58,237,0.35);display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;}
.btn-login:hover{opacity:0.92;transform:translateY(-2px);}
.btn-login.loading{opacity:0.7;pointer-events:none;}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--text-muted);font-size:12px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
.back-link{display:block;text-align:center;color:var(--text-muted);font-size:13px;text-decoration:none;transition:0.2s;padding:8px;}
.back-link:hover{color:var(--purple-light);}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg-card);color:var(--text);padding:13px 22px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:all 0.3s;z-index:9999;white-space:nowrap;border:1px solid var(--border);box-shadow:0 20px 40px rgba(0,0,0,0.4);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.success{background:var(--green);border-color:var(--green);}
</style>
</head>
<body>

<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>

<div class="login-wrap">
  <div class="brand-bar">
    <a class="brand-logo" href="index.html">📱 AHSAN <em>MOBILES</em></a>
  </div>

  <div class="admin-card">
    <div class="card-header">
      <div class="icon-wrap">🔐</div>
      <div class="card-title">Admin Access</div>
      <div class="card-sub">Authorized personnel only</div>
    </div>

    <div class="err-box" id="err-box"></div>

    <div class="field">
      <label>Admin Email</label>
      <div class="input-wrap">
        <span class="icon">✉️</span>
        <input type="email" id="admin-email" placeholder="sana180fatima@gmail.com" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
    </div>

    <div class="field">
      <label>Password</label>
      <div class="input-wrap">
        <span class="icon">🔑</span>
        <input type="password" id="admin-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
    </div>

    <div class="captcha-section">
      <span class="captcha-label">Security Verification</span>
      <div class="captcha-box">
        <div class="captcha-display">
          <div class="captcha-chars" id="captcha-chars"></div>
        </div>
        <button class="captcha-refresh" onclick="genCaptcha()" title="Refresh captcha">🔄</button>
      </div>
      <input class="captcha-input" type="text" id="captcha-input" placeholder="TYPE CODE" maxlength="5" autocomplete="off" oninput="this.value=this.value.toUpperCase()">
      <div class="captcha-hint">Type the 5 characters shown above</div>
      <div class="captcha-msg" id="captcha-msg"></div>
    </div>

    <button class="btn-login" id="login-btn" onclick="doLogin()">
      <span>🔐</span> Access Dashboard
    </button>

    <div class="divider">or</div>
    <a class="back-link" href="index.html">← Back to Ahsan Mobiles</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYw7O8vjPGUc8MzfjUiMCNgCnxh-fQDbs",
  authDomain: "ahsan-mobiles.firebaseapp.com",
  projectId: "ahsan-mobiles",
  storageBucket: "ahsan-mobiles.firebasestorage.app",
  messagingSenderId: "527845362077",
  appId: "1:527845362077:web:aa19595d090c08f648c774"
};

// ✅ APNI ADMIN EMAIL YAHAN HAI
const ADMIN_EMAIL = "sana180fatima@gmail.com";

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Agar pehle se login hai to seedha admin.html
onAuthStateChanged(auth, user => {
  if (user && user.email === ADMIN_EMAIL) {
    window.location.href = 'admin.html';
  }
});

// ── CAPTCHA ──
const CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
let captchaCode = '';

window.genCaptcha = function() {
  captchaCode = '';
  for(let i = 0; i < 5; i++) captchaCode += CHARS[Math.floor(Math.random() * CHARS.length)];
  const el = document.getElementById('captcha-chars');
  el.innerHTML = '';
  captchaCode.split('').forEach(ch => {
    const s = document.createElement('span');
    s.className = 'c-char';
    s.textContent = ch;
    el.appendChild(s);
  });
  document.getElementById('captcha-input').value = '';
  const msg = document.getElementById('captcha-msg');
  msg.className = 'captcha-msg';
  msg.textContent = '';
};

function checkCaptcha() {
  const val = document.getElementById('captcha-input').value.trim().toUpperCase();
  const msg = document.getElementById('captcha-msg');
  if (val === captchaCode) {
    msg.className = 'captcha-msg ok';
    msg.textContent = '✅ Verified!';
    return true;
  }
  msg.className = 'captcha-msg err';
  msg.textContent = '❌ Incorrect — try again';
  window.genCaptcha();
  return false;
}

function showErr(msg) {
  const el = document.getElementById('err-box');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 4000);
}

function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast', 3000);
}

// ── LOGIN ──
window.doLogin = async function() {
  const email = document.getElementById('admin-email').value.trim();
  const pass  = document.getElementById('admin-pass').value.trim();
  const btn   = document.getElementById('login-btn');

  if (!email) { showErr('Please enter your admin email'); return; }
  if (!pass)  { showErr('Please enter your password'); return; }
  if (!checkCaptcha()) return;

  // Sirf admin email allow hai
  if (email !== ADMIN_EMAIL) {
    showErr('❌ Access denied. Admin only.');
    window.genCaptcha();
    return;
  }

  btn.classList.add('loading');
  btn.innerHTML = '<span>⏳</span> Verifying...';

  try {
    await signInWithEmailAndPassword(auth, email, pass);
    showToast('✅ Access granted! Redirecting...', 'success');
    setTimeout(() => window.location.href = 'admin.html', 1200);
  } catch(e) {
    const errors = {
      'auth/invalid-credential': '❌ Wrong email or password.',
      'auth/user-not-found':     '❌ No admin found with this email.',
      'auth/wrong-password':     '❌ Wrong password.',
      'auth/too-many-requests':  '⏳ Too many attempts. Try later.',
    };
    showErr(errors[e.code] || '❌ Login failed. Try again.');
    btn.classList.remove('loading');
    btn.innerHTML = '<span>🔐</span> Access Dashboard';
    window.genCaptcha();
  }
};

window.genCaptcha();
</script>
</body>
</html>
