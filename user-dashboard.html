<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard — Ahsan Mobiles.pk</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a14'/%3E%3Crect x='2' y='2' width='28' height='28' rx='6' fill='none' stroke='%2300d4ff' stroke-width='1.5'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' font-family='Arial'%3E👤%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root{
  --nav-h:68px;--accent:#00d4ff;--accent2:#7c3aed;
  --success:#10b981;--danger:#ef4444;--gold:#f5c518;
  --bg:#0a0a14;--bg2:#0f0f1e;--surface:#13131f;--surface2:#1a1a2e;
  --border:rgba(255,255,255,0.07);--border2:rgba(0,212,255,0.18);
  --text:#f0f0ff;--text2:#c8c8e0;--muted:rgba(255,255,255,0.45);
  --card-bg:#13131f;--nav-bg:rgba(10,10,20,0.97);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);}
nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);background:var(--nav-bg);backdrop-filter:blur(24px);z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:0 40px;border-bottom:1px solid var(--border);}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.nav-logo-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.nav-logo-text{color:var(--text);font-weight:800;font-size:18px;}
.nav-logo-text span{color:var(--accent);}
.nav-links{display:flex;gap:4px;list-style:none;}
.nav-links a{color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;padding:8px 14px;border-radius:8px;transition:all .2s;}
.nav-links a:hover{color:var(--accent);background:rgba(0,212,255,0.08);}
.nav-actions{display:flex;gap:8px;align-items:center;}
.btn-login{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;}
.btn-shop{background:linear-gradient(135deg,var(--accent),#0099bb);border:none;color:#000;padding:8px 20px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;}
.hamburger{display:none;flex-direction:column;gap:5px;background:var(--surface2);border:1px solid var(--border);padding:8px;border-radius:8px;cursor:pointer;}
.hamburger span{display:block;width:20px;height:2px;background:var(--text);border-radius:2px;transition:.3s;}
.hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
.hamburger.open span:nth-child(2){opacity:0;}
.hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
.mob-menu{display:none;position:fixed;top:var(--nav-h);left:0;right:0;background:rgba(10,10,20,0.99);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:16px 24px;flex-direction:column;gap:4px;z-index:999;}
.mob-menu.open{display:flex;}
.mob-menu a{padding:12px 14px;border-radius:9px;font-size:.95rem;font-weight:500;color:var(--muted);text-decoration:none;}
.mob-menu a:hover{color:var(--accent);}

/* PAGE LAYOUT */
.page-wrap{max-width:960px;margin:0 auto;padding:calc(var(--nav-h) + 40px) 40px 80px;}

/* LOADING */
.loading-screen{text-align:center;padding:100px 20px;color:var(--muted);}
.loading-screen .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* TABS */
.dash-tabs{display:flex;gap:6px;margin-bottom:32px;border-bottom:1px solid var(--border);padding-bottom:0;}
.dash-tab{padding:12px 20px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;transition:.2s;display:flex;align-items:center;gap:7px;}
.dash-tab:hover{color:var(--text);}
.dash-tab.active{color:var(--accent);border-bottom-color:var(--accent);}

/* PANELS */
.dash-panel{display:none;}
.dash-panel.active{display:block;animation:panelIn .3s ease;}
@keyframes panelIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* PROFILE */
.profile-header{background:var(--card-bg);border:1.5px solid var(--border);border-radius:20px;padding:28px;display:flex;align-items:center;gap:20px;margin-bottom:20px;}
.profile-avatar-big{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;font-weight:800;font-size:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.profile-name{font-weight:800;font-size:20px;color:var(--text);margin-bottom:4px;}
.profile-email{color:var(--muted);font-size:14px;}
.profile-badge{display:inline-block;background:rgba(0,212,255,0.1);color:var(--accent);font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;border:1px solid rgba(0,212,255,0.2);margin-top:6px;}

.info-card{background:var(--card-bg);border:1.5px solid var(--border);border-radius:18px;padding:24px;margin-bottom:16px;}
.info-card-title{font-weight:700;font-size:15px;color:var(--text);margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;}
.info-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);}
.info-row:last-child{border:none;}
.info-label{font-size:13px;color:var(--muted);font-weight:600;}
.info-value{font-size:14px;font-weight:700;color:var(--text);}
.info-value.empty{color:var(--muted);font-weight:400;font-style:italic;}
.btn-edit{background:rgba(0,212,255,0.08);border:1px solid rgba(0,212,255,0.2);color:var(--accent);font-size:12px;font-weight:700;padding:6px 14px;border-radius:8px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:.2s;}
.btn-edit:hover{background:rgba(0,212,255,0.15);}

/* EDIT FORM */
.edit-form{display:none;margin-top:14px;}
.edit-form.open{display:block;}
.edit-input{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;font-size:14px;font-family:'Plus Jakarta Sans',sans-serif;color:var(--text);outline:none;margin-bottom:10px;transition:.2s;}
.edit-input:focus{border-color:var(--accent);}
.edit-input::placeholder{color:var(--muted);}
.edit-btns{display:flex;gap:8px;}
.btn-save{background:linear-gradient(135deg,var(--accent),#0099bb);color:#000;border:none;padding:10px 20px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;}
.btn-cancel{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:10px 16px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;}

/* ADDRESSES */
.addr-empty{text-align:center;padding:36px;color:var(--muted);}
.addr-empty .addr-icon{font-size:40px;margin-bottom:12px;}
.btn-add-addr{display:inline-flex;align-items:center;gap:7px;background:rgba(0,212,255,0.08);border:1.5px solid rgba(0,212,255,0.2);color:var(--accent);font-size:13px;font-weight:700;padding:10px 18px;border-radius:10px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:.2s;margin-top:12px;}
.btn-add-addr:hover{background:rgba(0,212,255,0.15);}
.addr-form{background:var(--surface2);border-radius:14px;padding:18px;margin-top:14px;display:none;}
.addr-form.open{display:block;}
.addr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}

/* ORDERS */
.orders-empty{text-align:center;padding:60px 20px;background:var(--card-bg);border:1.5px solid var(--border);border-radius:18px;}
.orders-empty-icon{font-size:56px;margin-bottom:14px;}
.orders-empty h3{font-size:18px;font-weight:700;margin-bottom:8px;}
.orders-empty p{color:var(--muted);font-size:14px;margin-bottom:20px;}
.btn-shop-now{display:inline-block;background:linear-gradient(135deg,var(--accent),#0099bb);color:#000;padding:12px 26px;border-radius:10px;font-size:14px;font-weight:700;text-decoration:none;font-family:'Plus Jakarta Sans',sans-serif;}
.order-card{background:var(--card-bg);border:1.5px solid var(--border);border-radius:18px;padding:22px;margin-bottom:14px;transition:border-color .2s;}
.order-card:hover{border-color:var(--border2);}
.order-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.order-id{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);}
.order-date{font-size:12px;color:var(--muted);}
.status-badge{font-size:12px;font-weight:700;padding:4px 12px;border-radius:100px;}
.status-pending{background:rgba(245,197,24,0.1);color:var(--gold);border:1px solid rgba(245,197,24,0.2);}
.status-processing{background:rgba(0,212,255,0.1);color:var(--accent);border:1px solid rgba(0,212,255,0.2);}
.status-delivered{background:rgba(16,185,129,0.1);color:var(--success);border:1px solid rgba(16,185,129,0.2);}
.order-items{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
.order-item-row{display:flex;align-items:center;gap:12px;}
.order-item-img{width:44px;height:44px;border-radius:9px;background:var(--bg2);overflow:hidden;flex-shrink:0;}
.order-item-img img{width:100%;height:100%;object-fit:contain;padding:4px;}
.order-item-name{font-size:13px;font-weight:600;color:var(--text2);flex:1;}
.order-item-qty{font-size:12px;color:var(--muted);}
.order-item-price{font-size:13px;font-weight:700;color:var(--text);}
.order-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:14px;}
.order-total{font-weight:800;font-size:16px;color:var(--text);}
.order-total span{color:var(--accent);}

/* DANGER ZONE */
.danger-card{background:rgba(239,68,68,0.04);border:1px solid rgba(239,68,68,0.15);border-radius:18px;padding:22px;margin-top:16px;}
.danger-title{font-weight:700;color:var(--danger);margin-bottom:12px;font-size:15px;}
.btn-danger{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);color:var(--danger);padding:11px 20px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:.2s;}
.btn-danger:hover{background:rgba(239,68,68,0.2);}
.btn-logout-full{background:rgba(239,68,68,0.08);border:1.5px solid rgba(239,68,68,0.2);color:var(--danger);padding:13px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;}
.btn-logout-full:hover{background:rgba(239,68,68,0.18);}

/* TOAST */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card-bg);color:#fff;padding:13px 22px;border-radius:11px;font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:3000;border:1px solid var(--border);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.success{background:var(--success);}
.toast.error{background:var(--danger);}

/* WA FLOAT */
.wa-float{position:fixed;right:20px;bottom:22px;z-index:999;}
.wa-btn{width:52px;height:52px;background:#25d366;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;box-shadow:0 4px 20px rgba(37,211,102,0.4);text-decoration:none;}

@media(max-width:600px){
  nav{padding:0 18px;}
  .nav-links{display:none;}
  .hamburger{display:flex;}
  .page-wrap{padding-left:18px;padding-right:18px;}
  .dash-tabs{overflow-x:auto;}
  .dash-tab{white-space:nowrap;}
  .addr-grid{grid-template-columns:1fr;}
  .profile-header{flex-direction:column;text-align:center;}
}
</style>
</head>

<!-- FIREBASE -->
<script type="module">
import { initializeApp }   from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut, updateProfile }
                           from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc,
         collection, query, where, getDocs, orderBy, serverTimestamp }
                           from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYw7O8vjPGUc8MzfjUiMCNgCnxh-fQDbs",
  authDomain: "ahsan-mobiles.firebaseapp.com",
  projectId: "ahsan-mobiles",
  storageBucket: "ahsan-mobiles.firebasestorage.app",
  messagingSenderId: "527845362077",
  appId: "1:527845362077:web:aa19595d090c08f648c774"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

let currentUser = null;

onAuthStateChanged(auth, async user => {
  const loading   = document.getElementById('loading-screen');
  const dashboard = document.getElementById('dashboard-content');

  if (!user) {
    // Not logged in — redirect to login
    window.location.href = 'login.html';
    return;
  }

  currentUser = user;
  loading.style.display   = 'none';
  dashboard.style.display = 'block';

  // Fill profile info
  const name     = user.displayName || user.email.split('@')[0];
  const initial  = name[0].toUpperCase();
  const joined   = user.metadata?.creationTime
    ? new Date(user.metadata.creationTime).toLocaleDateString('en-PK', {month:'long',year:'numeric'})
    : '—';

  document.getElementById('profile-avatar').textContent         = initial;
  document.getElementById('profile-display-name').textContent   = name;
  document.getElementById('profile-email').textContent          = user.email;
  document.getElementById('display-name-val').textContent       = name;
  document.getElementById('display-email-val').textContent      = user.email;
  document.getElementById('display-joined').textContent         = joined;
  document.getElementById('new-name-input').value               = name;

  // Load addresses from Firestore
  loadAddresses();

  // Load orders
  loadOrders();

  // Check URL tab
  const urlTab = new URLSearchParams(window.location.search).get('tab');
  if (urlTab) window.switchTab(urlTab);
});

// ── SAVE NAME ──
window.saveName = async function() {
  const newName = document.getElementById('new-name-input').value.trim();
  if (!newName) { showToast('Please enter a name', 'error'); return; }
  try {
    await updateProfile(currentUser, { displayName: newName });
    await updateDoc(doc(db, 'users', currentUser.uid), { name: newName });
    document.getElementById('profile-display-name').textContent = newName;
    document.getElementById('profile-avatar').textContent       = newName[0].toUpperCase();
    document.getElementById('display-name-val').textContent     = newName;
    toggleEdit('name-form');
    showToast('✅ Name updated!', 'success');
  } catch(e) {
    showToast('❌ Failed to update name', 'error');
  }
};

// ── ADDRESSES ──
window.toggleAddrForm = function() {
  document.getElementById('addr-form').classList.toggle('open');
};

window.saveAddress = async function() {
  const addr = {
    name:     document.getElementById('addr-name').value.trim(),
    phone:    document.getElementById('addr-phone').value.trim(),
    street:   document.getElementById('addr-street').value.trim(),
    city:     document.getElementById('addr-city').value.trim(),
    province: document.getElementById('addr-province').value.trim(),
    addedAt:  new Date().toISOString()
  };
  if (!addr.name || !addr.street || !addr.city) {
    showToast('Please fill required fields', 'error'); return;
  }
  try {
    const userRef = doc(db, 'users', currentUser.uid);
    const snap    = await getDoc(userRef);
    const existing = snap.exists() ? (snap.data().addresses || []) : [];
    existing.push(addr);
    await updateDoc(userRef, { addresses: existing });
    toggleAddrForm();
    ['addr-name','addr-phone','addr-street','addr-city','addr-province'].forEach(id => {
      document.getElementById(id).value = '';
    });
    loadAddresses();
    showToast('✅ Address saved!', 'success');
  } catch(e) {
    showToast('❌ Failed to save address', 'error');
  }
};

async function loadAddresses() {
  const list = document.getElementById('addresses-list');
  try {
    const snap = await getDoc(doc(db, 'users', currentUser.uid));
    const addresses = snap.exists() ? (snap.data().addresses || []) : [];

    if (!addresses.length) {
      list.innerHTML = `
        <div class="addr-empty">
          <div class="addr-icon">📍</div>
          <p>No addresses added yet.</p>
          <p style="font-size:12px;margin-top:6px;color:var(--muted)">Add an address for faster checkout!</p>
        </div>`;
      return;
    }

    list.innerHTML = addresses.map((a, i) => `
      <div class="info-row">
        <div>
          <div style="font-weight:700;font-size:14px;margin-bottom:3px;">${a.name} · ${a.phone || ''}</div>
          <div style="font-size:13px;color:var(--muted);">${a.street}, ${a.city}, ${a.province}</div>
        </div>
        <button class="btn-edit" style="background:rgba(239,68,68,0.08);border-color:rgba(239,68,68,0.2);color:var(--danger);" onclick="deleteAddress(${i})">🗑️</button>
      </div>`).join('');
  } catch(e) {
    list.innerHTML = '<p style="color:var(--muted);font-size:13px;padding:16px">Could not load addresses.</p>';
  }
}

window.deleteAddress = async function(idx) {
  const snap = await getDoc(doc(db, 'users', currentUser.uid));
  const addresses = snap.data().addresses || [];
  addresses.splice(idx, 1);
  await updateDoc(doc(db, 'users', currentUser.uid), { addresses });
  loadAddresses();
  showToast('🗑️ Address removed', 'error');
};

// ── ORDERS ──
async function loadOrders() {
  const el = document.getElementById('orders-content');
  try {
    const q    = query(collection(db, 'orders'), where('userId', '==', currentUser.uid), orderBy('createdAt', 'desc'));
    const snap = await getDocs(q);

    if (snap.empty) {
      el.innerHTML = `
        <div class="orders-empty">
          <div class="orders-empty-icon">📦</div>
          <h3>No orders yet</h3>
          <p>Your orders will appear here once you place them!</p>
          <a class="btn-shop-now" href="products.html">Start Shopping →</a>
        </div>`;
      return;
    }

    el.innerHTML = snap.docs.map(d => {
      const o = d.data();
      const statusClass = o.status === 'delivered' ? 'status-delivered'
        : o.status === 'processing' ? 'status-processing' : 'status-pending';
      const date = o.createdAt?.toDate
        ? o.createdAt.toDate().toLocaleDateString('en-PK', {day:'numeric',month:'short',year:'numeric'})
        : 'N/A';
      const items = (o.items || []).map(item => `
        <div class="order-item-row">
          <div class="order-item-img">
            <img src="${item.img || ''}" onerror="this.style.display='none'">
          </div>
          <span class="order-item-name">${item.name}</span>
          <span class="order-item-qty">×${item.qty || 1}</span>
          <span class="order-item-price">Rs. ${(item.price * (item.qty||1)).toLocaleString()}</span>
        </div>`).join('');

      return `
        <div class="order-card">
          <div class="order-header">
            <div>
              <div class="order-id">Order #${d.id.slice(-8).toUpperCase()}</div>
              <div class="order-date">${date}</div>
            </div>
            <span class="status-badge ${statusClass}">${(o.status || 'Pending').toUpperCase()}</span>
          </div>
          <div class="order-items">${items}</div>
          <div class="order-footer">
            <span class="order-total">Total: <span>Rs. ${(o.total || 0).toLocaleString()}</span></span>
            ${o.status !== 'delivered' ? `<a href="https://wa.me/923054603311?text=Order%20status%20for%20%23${d.id.slice(-8).toUpperCase()}" target="_blank" style="color:var(--accent);font-size:13px;font-weight:600;text-decoration:none;">📞 Track Order</a>` : ''}
          </div>
        </div>`;
    }).join('');

  } catch(e) {
    // Orders collection might not exist yet
    el.innerHTML = `
      <div class="orders-empty">
        <div class="orders-empty-icon">📦</div>
        <h3>No orders yet</h3>
        <p>Your orders will appear here once you place them!</p>
        <a class="btn-shop-now" href="products.html">Start Shopping →</a>
      </div>`;
  }
}

// ── LOGOUT ──
window.doLogout = async function() {
  await signOut(auth);
  window.location.href = 'index.html';
};
</script>

<script>
function switchTab(name) {
  document.querySelectorAll('.dash-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.dash-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
}

function toggleEdit(formId) {
  document.getElementById(formId).classList.toggle('open');
}

function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className   = 'toast show ' + type;
  setTimeout(() => t.className = 'toast', 3000);
}

window.switchTab = switchTab;
</script>
