<style>
:root{
  --nav-h:68px;--accent:#00d4ff;--accent2:#7c3aed;--gold:#f5c518;
  --success:#10b981;--bg:#0a0a14;--bg2:#0f0f1e;--surface2:#1a1a2e;
  --border:rgba(255,255,255,0.07);--border2:rgba(0,212,255,0.18);
  --text:#f0f0ff;--muted:rgba(255,255,255,0.45);--card-bg:#13131f;
  --nav-bg:rgba(10,10,20,0.97);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);background:var(--nav-bg);backdrop-filter:blur(24px);z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:0 40px;border-bottom:1px solid var(--border);}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.nav-logo-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.nav-logo-text{color:var(--text);font-weight:800;font-size:18px;}
.nav-logo-text span{color:var(--accent);}
.nav-links{display:flex;gap:4px;list-style:none;}
.nav-links a{color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;padding:8px 14px;border-radius:8px;transition:all 0.2s;}
.nav-links a:hover,.nav-links a.active{color:var(--accent);background:rgba(0,212,255,0.08);}
.nav-actions{display:flex;gap:8px;align-items:center;}
.btn-login{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s;font-family:'Plus Jakarta Sans',sans-serif;}
.btn-login:hover{border-color:var(--accent);color:var(--accent);}
.btn-shop{background:linear-gradient(135deg,var(--accent),#0099bb);border:none;color:#000;padding:8px 20px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:.2s;font-family:'Plus Jakarta Sans',sans-serif;}
.btn-shop:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,212,255,0.4);}
.hamburger{display:none;flex-direction:column;gap:5px;background:var(--surface2);border:1px solid var(--border);padding:8px;border-radius:8px;cursor:pointer;}
.hamburger span{display:block;width:20px;height:2px;background:var(--text);border-radius:2px;transition:.3s;}
.hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
.hamburger.open span:nth-child(2){opacity:0;}
.hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
.mob-menu{display:none;position:fixed;top:var(--nav-h);left:0;right:0;background:rgba(10,10,20,0.99);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:16px 24px;flex-direction:column;gap:4px;z-index:999;}
.mob-menu.open{display:flex;}
.mob-menu a{padding:12px 14px;border-radius:9px;font-size:.95rem;font-weight:500;color:var(--muted);text-decoration:none;}
.mob-menu a:hover{color:var(--accent);}

/* LANG */
.lang-dropdown-wrap{position:relative;}
.lang-btn{background:var(--surface2);border:1px solid var(--border2);color:var(--accent);padding:7px 13px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;font-family:'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.lang-btn:hover{border-color:var(--accent);background:rgba(0,212,255,0.1);}
.lang-arrow{font-size:10px;transition:transform .2s;}
.lang-dropdown-wrap.open .lang-arrow{transform:rotate(180deg);}
.lang-menu{position:absolute;top:calc(100% + 8px);right:0;background:#13131f;border:1px solid var(--border2);border-radius:12px;padding:6px;min-width:150px;z-index:9999;display:none;box-shadow:0 12px 40px rgba(0,0,0,0.5);}
.lang-dropdown-wrap.open .lang-menu{display:block;}
.lang-option{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);transition:.2s;}
.lang-option:hover{background:rgba(0,212,255,0.08);color:var(--text);}
.lang-option.active-lang{background:rgba(0,212,255,0.1);color:var(--accent);}
.lang-option .check{color:var(--accent);font-size:12px;opacity:0;}
.lang-option.active-lang .check{opacity:1;}

/* PAGE */
.page-wrap{max-width:1200px;margin:0 auto;padding:calc(var(--nav-h) + 40px) 40px 80px;}

.back-btn{display:inline-flex;align-items:center;gap:8px;color:var(--muted);cursor:pointer;font-size:14px;font-weight:600;margin-bottom:32px;transition:.2s;text-decoration:none;background:rgba(255,255,255,0.04);border:1px solid var(--border);padding:9px 16px;border-radius:10px;}
.back-btn:hover{color:var(--accent);border-color:var(--accent);}

/* DETAIL GRID */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:start;}

/* SLIDESHOW */
.slideshow-wrap{position:relative;background:var(--bg2);border-radius:20px;overflow:hidden;border:1px solid var(--border);aspect-ratio:4/3;}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 0.5s ease;}
.slide.active{opacity:1;}
.slide img{width:100%;height:100%;object-fit:contain;padding:10px;}
.slide-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:10;background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.15);color:#fff;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;transition:all .25s;backdrop-filter:blur(6px);}
.slide-arrow:hover{background:var(--accent);color:#000;border-color:var(--accent);}
.slide-prev{left:12px;}
.slide-next{right:12px;}
.slide-dots{display:flex;gap:7px;justify-content:center;margin-top:12px;}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.2);cursor:pointer;transition:all .2s;}
.dot.active{background:var(--accent);width:22px;border-radius:4px;}
.thumbs{display:flex;gap:10px;margin-top:12px;overflow-x:auto;padding-bottom:4px;}
.thumbs::-webkit-scrollbar{height:4px;}
.thumbs::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
.thumb{width:68px;height:68px;background:var(--bg2);border-radius:12px;border:2px solid var(--border);overflow:hidden;cursor:pointer;transition:.2s;flex-shrink:0;}
.thumb img{width:100%;height:100%;object-fit:contain;padding:4px;}
.thumb.active,.thumb:hover{border-color:var(--accent);}

/* COLORS */
.color-section{margin-top:20px;}
.color-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:10px;}
.color-variants{display:flex;gap:10px;flex-wrap:wrap;}
.color-btn{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;transition:all .2s;}
.color-circle{width:36px;height:36px;border-radius:50%;border:2.5px solid transparent;transition:all .2s;}
.color-btn.active .color-circle,.color-btn:hover .color-circle{border-color:var(--accent);transform:scale(1.1);box-shadow:0 0 0 3px rgba(0,212,255,0.25);}
.color-name-label{font-size:10px;color:var(--muted);font-weight:600;text-align:center;max-width:60px;line-height:1.2;}
.color-btn.active .color-name-label{color:var(--accent);}

/* INFO */
.stock-badge{display:inline-block;background:rgba(16,185,129,0.1);color:var(--success);font-size:13px;font-weight:700;padding:6px 14px;border-radius:100px;border:1px solid rgba(16,185,129,0.2);margin-bottom:16px;}
.detail-name{font-family:'Bebas Neue',cursive;font-size:38px;color:var(--text);line-height:1.05;letter-spacing:1px;}
.detail-brand{color:var(--muted);font-size:13px;margin-top:6px;font-weight:600;}
.detail-price-row{display:flex;align-items:center;gap:14px;margin-top:20px;flex-wrap:wrap;}
.price-current{font-size:34px;font-weight:800;color:var(--text);}
.price-old{font-size:18px;color:var(--muted);text-decoration:line-through;}
.price-save{background:rgba(124,58,237,0.15);color:#a78bfa;font-size:12px;font-weight:700;padding:4px 10px;border-radius:100px;}

/* DESCRIPTION */
.desc-wrap{margin-top:18px;border-top:1px solid var(--border);padding-top:18px;}
.desc-lang-toggle{display:flex;gap:0;margin-bottom:12px;background:var(--bg2);border-radius:8px;padding:3px;width:fit-content;}
.desc-lang-btn{padding:6px 16px;border:none;background:transparent;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;border-radius:6px;transition:.2s;font-family:'Plus Jakarta Sans',sans-serif;}
.desc-lang-btn.active{background:var(--accent);color:#000;}
.detail-desc{color:var(--muted);font-size:15px;line-height:1.75;}
.detail-desc.ur{font-family:'Noto Nastaliq Urdu',serif;line-height:2.2;font-size:16px;direction:rtl;text-align:right;}

/* SPECS */
.specs-title{font-weight:700;font-size:13px;color:var(--text);margin-top:22px;margin-bottom:10px;text-transform:uppercase;letter-spacing:1px;}
.spec-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.spec-row:last-child{border:none;}
.spec-k{color:var(--muted);font-size:13px;width:130px;flex-shrink:0;}
.spec-v{font-weight:600;font-size:13px;color:var(--text);}

/* BUTTONS */
.detail-btns{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap;}
.btn-order{flex:1;min-width:160px;background:linear-gradient(135deg,var(--accent),#0099bb);color:#000;border:none;padding:15px;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;transition:all .2s;font-family:'Plus Jakarta Sans',sans-serif;}
.btn-order:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,212,255,0.35);}
.btn-cart{flex:1;min-width:160px;background:var(--card-bg);color:var(--text);border:1.5px solid var(--border2);padding:15px;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;transition:all .2s;font-family:'Plus Jakarta Sans',sans-serif;}
.btn-cart:hover{background:rgba(0,212,255,0.08);border-color:var(--accent);color:var(--accent);transform:translateY(-2px);}
.btn-cart.added{background:var(--success);border-color:var(--success);color:#fff;}
.btn-wish{width:52px;height:52px;background:var(--card-bg);border:1.5px solid var(--border);border-radius:14px;font-size:20px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;}
.btn-wish:hover{border-color:var(--accent2);}
.delivery-box{margin-top:16px;padding:14px 16px;background:rgba(16,185,129,0.06);border-radius:12px;font-size:13px;color:var(--success);border:1px solid rgba(16,185,129,0.15);line-height:1.6;}

/* NOT FOUND */
.not-found{text-align:center;padding:100px 20px;}
.not-found .emoji{font-size:60px;margin-bottom:20px;}
.not-found h2{font-size:22px;font-weight:700;margin-bottom:10px;}
.not-found p{color:var(--muted);margin-bottom:24px;}
.not-found a{color:var(--accent);font-weight:700;text-decoration:none;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:2000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px);}
.modal-overlay.active{display:flex;}
.modal-box{background:var(--card-bg);border-radius:22px;padding:38px;max-width:400px;width:90%;text-align:center;border:1px solid var(--border2);animation:popIn .3s ease;}
@keyframes popIn{from{transform:scale(0.9);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal-icon{font-size:48px;margin-bottom:14px;}
.modal-title{font-weight:800;font-size:20px;margin-bottom:6px;color:var(--text);}
.modal-sub{color:var(--muted);font-size:14px;margin-bottom:22px;}
.modal-close{background:var(--surface2);color:#fff;border:1px solid var(--border);padding:12px 32px;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:.2s;}
.modal-close:hover{border-color:var(--accent);color:var(--accent);}

/* TOAST */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg2);color:#fff;padding:13px 22px;border-radius:11px;font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:3000;white-space:nowrap;border:1px solid var(--border);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.success{background:var(--success);border-color:var(--success);}

/* WA */
.wa-float{position:fixed;right:20px;bottom:22px;z-index:999;}
.wa-btn{width:52px;height:52px;background:#25d366;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;box-shadow:0 4px 20px rgba(37,211,102,0.4);text-decoration:none;transition:.3s;animation:waPulse 3s ease-in-out infinite;}
.wa-btn:hover{transform:scale(1.1);}
@keyframes waPulse{0%,100%{box-shadow:0 4px 20px rgba(37,211,102,0.35);}50%{box-shadow:0 4px 38px rgba(37,211,102,0.65);}}

/* FOOTER */
footer{background:#06060f;padding:40px;border-top:1px solid rgba(255,255,255,0.05);text-align:center;color:rgba(255,255,255,0.25);font-size:12px;}
footer span{color:var(--accent);}

/* RTL */
body.rtl-mode{direction:rtl;}
body.rtl-mode nav{flex-direction:row-reverse;}
body.rtl-mode .nav-links{flex-direction:row-reverse;}
body.rtl-mode .nav-actions{flex-direction:row-reverse;}
body.rtl-mode .detail-info{text-align:right;}
body.rtl-mode .spec-row{flex-direction:row-reverse;}
body.rtl-mode .spec-k{text-align:right;}
body.rtl-mode .slide-prev{left:auto;right:12px;}
body.rtl-mode .slide-next{right:auto;left:12px;}
.urdu-text{font-family:'Noto Nastaliq Urdu',serif;line-height:2;}

/* RESPONSIVE */
@media(max-width:900px){.detail-grid{grid-template-columns:1fr;}.page-wrap{padding:calc(var(--nav-h)+24px) 18px 60px;}}
@media(max-width:600px){.nav-links{display:none;}.hamburger{display:flex;}nav{padding:0 18px;}.detail-name{font-size:28px;}}
</style>
</head>

// ===== STATE =====
let currentLang = localStorage.getItem('ahsan-lang') || 'en';
let currentProduct = null;
let slideIndex = 0;
let slideTotal = 0;
let slideTimer = null;

// ===== RENDER DETAIL =====
function renderDetail() {
  const id = parseInt(new URLSearchParams(window.location.search).get('id'));
  const root = document.getElementById('detail-root');
  if (!id || isNaN(id)) {
    root.innerHTML = notFoundHTML('No product ID found. Please go back and select a product.');
    return;
  }
  const p = allProducts.find(x => x.id === id);
  if (!p) {
    root.innerHTML = notFoundHTML('Product #' + id + ' was not found.');
    return;
  }
  currentProduct = p;
  document.title = p.name + ' — Ahsan Mobiles.pk';
  const isUrdu = currentLang === 'ur';
  const save = Math.round((1 - p.price / p.oldPrice) * 100);

  // Slides
  const slidesHTML = p.imgs.map((src, i) =>
    '<div class="slide ' + (i === 0 ? 'active' : '') + '" id="slide-' + i + '"><img src="' + src + '" alt="' + p.name + '" loading="lazy"></div>'
  ).join('');

  // Dots
  const dotsHTML = p.imgs.map((_, i) =>
    '<div class="dot ' + (i === 0 ? 'active' : '') + '" id="dot-' + i + '" onclick="goToSlide(' + i + ')"></div>'
  ).join('');

  // Thumbs
  const thumbsHTML = p.imgs.map((src, i) =>
    '<div class="thumb ' + (i === 0 ? 'active' : '') + '" id="thumb-' + i + '" onclick="goToSlide(' + i + ')"><img src="' + src + '" alt="" loading="lazy"></div>'
  ).join('');

  // Colors
  let colorHTML = '';
  if (p.colors && p.colors.length > 0) {
    colorHTML = '<div class="color-section"><div class="color-label">' + (isUrdu ? 'رنگ منتخب کریں' : 'Select Color') + '</div><div class="color-variants" id="color-variants">';
    p.colors.forEach(function(c, i) {
      colorHTML += '<div class="color-btn ' + (i === 0 ? 'active' : '') + '" onclick="selectColor(' + i + ')" id="cbtn-' + i + '"><div class="color-circle" style="background:' + c.hex + ';"></div><div class="color-name-label">' + (isUrdu ? c.nameUr : c.name) + '</div></div>';
    });
    colorHTML += '</div></div>';
  }

  // Specs
  const specsHTML = Object.entries(p.specs).map(function(entry) {
    return '<div class="spec-row"><span class="spec-k">' + entry[0] + '</span><span class="spec-v">' + entry[1] + '</span></div>';
  }).join('');

  root.innerHTML =
    '<div class="detail-grid">' +
      '<div class="detail-imgs">' +
        '<div class="slideshow-wrap" id="slideshow">' +
          slidesHTML +
          '<button class="slide-arrow slide-prev" onclick="prevSlide()">&#8249;</button>' +
          '<button class="slide-arrow slide-next" onclick="nextSlide()">&#8250;</button>' +
        '</div>' +
        '<div class="slide-dots">' + dotsHTML + '</div>' +
        '<div class="thumbs">' + thumbsHTML + '</div>' +
        colorHTML +
      '</div>' +
      '<div class="detail-info">' +
        '<div class="stock-badge">✅ ' + (isUrdu ? 'اسٹاک میں ہے' : 'In Stock — Ready to Ship') + '</div>' +
        '<div class="detail-name">' + (isUrdu ? p.nameUr : p.name) + '</div>' +
        '<div class="detail-brand">' + p.brand + ' &nbsp;·&nbsp; ' + p.cat.replace(/-/g, ' ') + '</div>' +
        '<div class="detail-price-row">' +
          '<div class="price-current">&#8360;' + p.price.toLocaleString() + '</div>' +
          '<div class="price-old">&#8360;' + p.oldPrice.toLocaleString() + '</div>' +
          '<div class="price-save">' + save + '% OFF</div>' +
        '</div>' +
        '<div class="desc-wrap">' +
          '<div class="desc-lang-toggle">' +
            '<button class="desc-lang-btn ' + (!isUrdu ? 'active' : '') + '" id="desc-en-btn" onclick="switchDesc(\'en\')">EN</button>' +
            '<button class="desc-lang-btn ' + (isUrdu ? 'active' : '') + '" id="desc-ur-btn" onclick="switchDesc(\'ur\')">اردو</button>' +
          '</div>' +
          '<div class="detail-desc ' + (isUrdu ? 'ur' : '') + '" id="desc-text">' + (isUrdu ? p.descUr : p.desc) + '</div>' +
        '</div>' +
        '<div class="specs-title">' + (isUrdu ? 'خصوصیات' : 'Specifications') + '</div>' +
        specsHTML +
        '<div class="detail-btns">' +
          '<button class="btn-order" onclick="orderNow()">🛒 ' + (isUrdu ? 'واٹس ایپ پر آرڈر کریں' : 'Order via WhatsApp') + '</button>' +
          '<button class="btn-wish" id="wish-btn" onclick="wishlistToggle()">❤️</button>' +
        '</div>' +
        '<div class="delivery-box">🚚 <strong>' + (isUrdu ? 'سرگودھا میں مفت ڈلیوری' : 'Free delivery in Sargodha') + '</strong> &nbsp;·&nbsp; ' + (isUrdu ? 'کیش آن ڈلیوری' : 'Cash on Delivery') + ' &nbsp;·&nbsp; ' + (isUrdu ? '7 دن واپسی' : 'Easy 7-day returns') + '</div>' +
      '</div>' +
    '</div>';

  slideTotal = p.imgs.length;
  slideIndex = 0;
  startAutoSlide();
}

function notFoundHTML(msg) {
  return '<div class="not-found"><div class="emoji">😕</div><h2>Product Not Found</h2><p>' + msg + '</p><a href="products.html">← Browse All Products</a></div>';
}

// ===== SLIDESHOW =====
function goToSlide(idx) {
  document.querySelectorAll('.slide').forEach(function(s) { s.classList.remove('active'); });
  document.querySelectorAll('.dot').forEach(function(d) { d.classList.remove('active'); });
  document.querySelectorAll('.thumb').forEach(function(t) { t.classList.remove('active'); });
  slideIndex = ((idx % slideTotal) + slideTotal) % slideTotal;
  var s = document.getElementById('slide-' + slideIndex);
  var d = document.getElementById('dot-' + slideIndex);
  var t = document.getElementById('thumb-' + slideIndex);
  if (s) s.classList.add('active');
  if (d) d.classList.add('active');
  if (t) { t.classList.add('active'); t.scrollIntoView({block:'nearest',inline:'nearest'}); }
}

function nextSlide() { goToSlide(slideIndex + 1); resetAutoSlide(); }
function prevSlide() { goToSlide(slideIndex - 1); resetAutoSlide(); }

function startAutoSlide() {
  if (slideTimer) clearInterval(slideTimer);
  if (slideTotal > 1) slideTimer = setInterval(function() { goToSlide(slideIndex + 1); }, 3500);
}
function resetAutoSlide() { if (slideTimer) clearInterval(slideTimer); startAutoSlide(); }

// ===== COLOR =====
function selectColor(colorIdx) {
  var p = currentProduct;
  if (!p || !p.colors[colorIdx]) return;
  document.querySelectorAll('[id^="cbtn-"]').forEach(function(btn, i) { btn.classList.toggle('active', i === colorIdx); });
  goToSlide(p.colors[colorIdx].imgIdx);
  resetAutoSlide();
}

// ===== DESC TOGGLE =====
function switchDesc(lang) {
  var p = currentProduct; if (!p) return;
  var el = document.getElementById('desc-text');
  var enBtn = document.getElementById('desc-en-btn');
  var urBtn = document.getElementById('desc-ur-btn');
  if (!el) return;
  if (lang === 'ur') {
    el.textContent = p.descUr;
    el.className = 'detail-desc ur';
    if (enBtn) enBtn.classList.remove('active');
    if (urBtn) urBtn.classList.add('active');
  } else {
    el.textContent = p.desc;
    el.className = 'detail-desc';
    if (enBtn) enBtn.classList.add('active');
    if (urBtn) urBtn.classList.remove('active');
  }
}

// ===== ORDER =====
function orderNow() {
  var p = currentProduct; if (!p) return;
  var isUrdu = currentLang === 'ur';
  var msg = 'Assalam o Alaikum! I want to order:\n\n📱 ' + p.name + '\n💰 Price: Rs.' + p.price.toLocaleString() + '\n\nPlease confirm availability.';
  document.getElementById('modal-icon').textContent = '🛒';
  document.getElementById('modal-title').textContent = isUrdu ? 'واٹس ایپ پر آرڈر کریں!' : 'Order via WhatsApp!';
  document.getElementById('modal-sub').innerHTML =
    '<strong>' + (isUrdu ? p.nameUr : p.name) + '</strong><br>' +
    '<span style="color:var(--accent);font-size:20px;font-weight:800;">&#8360;' + p.price.toLocaleString() + '</span><br><br>' +
    '<a href="https://wa.me/923091333812?text=' + encodeURIComponent(msg) + '" target="_blank" style="display:inline-block;background:#25d366;color:#fff;padding:13px 30px;border-radius:11px;font-weight:700;text-decoration:none;font-size:15px;">💬 ' + (isUrdu ? 'واٹس ایپ کھولیں' : 'Open WhatsApp') + '</a>';
  document.getElementById('modal-overlay').classList.add('active');
}

// ===== WISHLIST =====
function wishlistToggle() {
  var btn = document.getElementById('wish-btn');
  if (!btn) return;
  btn.textContent = btn.textContent === '❤️' ? '🤍' : '❤️';
  showToast(currentLang === 'ur' ? 'خواہش کی فہرست میں شامل' : 'Added to wishlist ❤️', 'success');
}

function closeModal() { document.getElementById('modal-overlay').classList.remove('active'); }

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(function() { t.className = 'toast'; }, 3000);
}

// ===== KEYBOARD =====
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'ArrowRight') nextSlide();
  if (e.key === 'ArrowLeft') prevSlide();
});

// ===== LANGUAGE =====
var LANGS = {
  en:{flag:'🇺🇸',label:'EN',dir:'ltr',t:{'Home':'Home','Products':'Products','About':'About','Offers':'Offers','Contact':'Contact','Help':'Help','Login':'Login','Shop Now →':'Shop Now →'}},
  ur:{flag:'🇵🇰',label:'اردو',dir:'rtl',t:{'Home':'ہوم','Products':'پروڈکٹس','About':'ہمارے بارے میں','Offers':'آفرز','Contact':'رابطہ','Help':'مدد','Login':'لاگ ان','Shop Now →':'ابھی خریدیں →'}},
  hi:{flag:'🇮🇳',label:'हिं',dir:'ltr',t:{'Home':'होम','Products':'उत्पाद','About':'हमारे बारे में','Offers':'ऑफर','Contact':'संपर्क','Help':'सहायता','Login':'लॉगिन','Shop Now →':'अभी खरीदें →'}},
  ar:{flag:'🇸🇦',label:'عر',dir:'rtl',t:{'Home':'الرئيسية','Products':'المنتجات','About':'معلومات','Offers':'العروض','Contact':'اتصل','Help':'مساعدة','Login':'دخول','Shop Now →':'تسوق →'}}
};

function toggleLangMenu() { document.getElementById('lang-wrap').classList.toggle('open'); }

document.addEventListener('click', function(e) {
  var w = document.getElementById('lang-wrap');
  if (w && !w.contains(e.target)) w.classList.remove('open');
});

function setLang(code) {
  currentLang = code;
  localStorage.setItem('ahsan-lang', code);
  var lang = LANGS[code];
  document.getElementById('lang-flag').textContent = lang.flag;
  document.getElementById('lang-label').textContent = lang.label;
  document.querySelectorAll('.lang-option').forEach(function(opt) {
    opt.classList.remove('active-lang');
    if (opt.getAttribute('onclick') && opt.getAttribute('onclick').indexOf("'" + code + "'") !== -1) opt.classList.add('active-lang');
  });
  document.documentElement.dir = lang.dir;
  document.body.classList.toggle('rtl-mode', lang.dir === 'rtl');
  document.querySelectorAll('[data-translate]').forEach(function(el) {
    var orig = el.getAttribute('data-orig') || el.textContent.trim();
    if (!el.getAttribute('data-orig')) el.setAttribute('data-orig', orig);
    el.textContent = lang.t[orig] || orig;
  });
  document.getElementById('lang-wrap').classList.remove('open');
  var bb = document.getElementById('back-btn');
  if (bb) bb.textContent = (code === 'ur') ? '← پروڈکٹس پر واپس جائیں' : '← Back to Products';
  if (slideTimer) clearInterval(slideTimer);
  renderDetail();
}

// ===== INIT =====
document.addEventListener('DOMContentLoaded', function() {
  if (currentLang !== 'en') {
    setLang(currentLang);
  } else {
    document.querySelectorAll('.lang-option').forEach(function(opt) {
      opt.classList.remove('active-lang');
      if (opt.getAttribute('onclick') && opt.getAttribute('onclick').indexOf("'en'") !== -1) opt.classList.add('active-lang');
    });
    renderDetail();
  }
});
</script>
